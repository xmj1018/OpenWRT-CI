# SPDX-License-Identifier: MIT
# 自定义编译入口：仅编译 qualcommbe/ipq95xx/xiaomi_be10000
# 基于 VIKINGYFY/OpenWRT-CI 的 WRT-TEST.yml，固定参数、真正编译（TEST=false）

name: IPQ95XX-BUILD

on:
  workflow_dispatch:

permissions: write-all

jobs:
  config:
    name: IPQ95XX
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: IPQ95XX
      WRT_THEME: argon
      # 主机名设为官方大小写 ImmortalWRT（argon 左上角/登录页品牌字取此值）
      WRT_NAME: ImmortalWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: owrt
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_PACKAGE: ''
      WRT_TEST: false
